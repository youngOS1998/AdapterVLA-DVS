# 单卡断点调试。给 debug_event_train.py 和 .vscode/launch.json 用。
# 正式训练仍走 vla-scripts/train_grasp_conveyor_rand_speed_2_event.sh。
# 路径是仓库根目录下的绝对或相对路径。
#
# 建议断点：
#   prismatic/vla/datasets/datasets.py          RLDSBatchTransform.__call__
#   prismatic/vla/datasets/event_volume.py      EventVolumeIndex.sample
#   vla-scripts/finetune.py                     run_forward_pass
#   prismatic/models/action_heads.py            predict_action / _encode_events

dataset_name: grasp_conveyor_rand_speed_2
data_root_dir: /mnt/Projects_origin/VLA-Adapter/data/robotwin_rlds
event_data_root: /mnt/Projects_origin/VLA-Adapter-DVS/data/grasp_conveyor_rand_speed_2
vlm_path: pretrained_models/prism-qwen25-extra-dinosiglip-224px-0_5b
config_file_path: pretrained_models/configs
run_root_dir: outputs

use_event_fusion: true
future_center_steps: 16
future_center_weight: 1.0
future_action_window_size: 11

# 只跑两步，方便在训练循环里停住看张量。需要多看几步就改这里。
max_steps: 1000
batch_size: 8
grad_accumulation_steps: 1
learning_rate: 2.0e-4
num_steps_before_decay: 5000
shuffle_buffer_size: 32
image_aug: false
save_freq: 100000
save_latest_checkpoint_only: true
merge_lora_during_training: false

num_images_in_input: 2
use_proprio: true
use_lora: true
use_fz: false
use_minivlm: true
use_pro_version: true
use_film: false
lora_rank: 64

wandb_entity: none
wandb_project: grasp_conveyor_rand_speed_2_debug
run_id_note: VLA-Adapter-Event-debug

# 必须是一张卡。两张及以上会走 torchrun，当前进程被换掉，断点失效。
# 0–3 号卡留给正式训练，这里用空闲的 4 号卡。
gpus: [4]
